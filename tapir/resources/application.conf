db-connection-url="jdbc:h2:file:cards"
db-driver="org.h2.Driver"
db-threads=2

parallel-max=2

port = 8080

load-race-delay = 100.millis

request-config {
  timeout     = 100 seconds
  retry-time  = 1 second
  max-retries = 3
}

paths {
  init-scripts = "dbInitScripts"
  xml-cards    = "cards.xml"
}